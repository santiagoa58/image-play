name: Temp wordcloud rotation verification

on:
  push:
    branches:
      - feature/init-wordcloud
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Build test toolchain
        run: docker build --target toolchain -t image-play:toolchain .

      - name: Run tests
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            image-play:toolchain \
            go test ./...

      - name: Build CLI image for DeepSeek
        run: docker build --target runtime -t image-play:wordcloud-full .

      - name: Generate DeepSeek word cloud with full 1000-word limit
        run: |
          mkdir -p action-output
          chmod 777 action-output
          timeout 6m docker run --rm \
            -v "$PWD/testdata:/work/testdata:ro" \
            -v "$PWD/fonts:/work/fonts:ro" \
            -v "$PWD/action-output:/work/output" \
            image-play:wordcloud-full \
            -in /work/testdata/images/deepseek-logo-icon.png \
            -text /work/testdata/text/sample_text_message.txt \
            -font "/work/fonts/NotoSansMono-VariableFont_wdth,wght.ttf" \
            -out /work/output/deepseek-logo-icon-wordcloud.png

      - name: Build smaller-limit CLI for generalization checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("internal/effects/wordcloud/config.go")
          s = p.read_text().replace("WordLimit:               1000,", "WordLimit:               200,")
          p.write_text(s)
          PY
          docker build --target runtime -t image-play:wordcloud-generalization .

      - name: Generate word clouds for remaining test images
        run: |
          for image in \
            testdata/images/couple_tour.jpg \
            testdata/images/gen-img-couple.png \
            testdata/images/keeks_no_bckgrnd.png
          do
            name="$(basename "$image")"
            stem="${name%.*}"
            echo "::group::Generating $name"
            timeout 4m docker run --rm \
              -v "$PWD/testdata:/work/testdata:ro" \
              -v "$PWD/fonts:/work/fonts:ro" \
              -v "$PWD/action-output:/work/output" \
              image-play:wordcloud-generalization \
              -in "/work/$image" \
              -text /work/testdata/text/sample_text_message.txt \
              -font "/work/fonts/NotoSansMono-VariableFont_wdth,wght.ttf" \
              -out "/work/output/$stem-wordcloud.png"
            echo "::endgroup::"
          done

      - name: Verify generated outputs
        run: |
          for output in action-output/*-wordcloud.png; do
            test -s "$output"
            file "$output"
            ls -lh "$output"
          done

      - name: Upload generated word clouds
        uses: actions/upload-artifact@v4
        with:
          name: wordcloud-rotation-results
          path: action-output/*-wordcloud.png
          if-no-files-found: error
