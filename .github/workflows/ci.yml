name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build --target toolchain -t image-play:toolchain .

      - name: Check formatting
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            image-play:toolchain \
            sh -c 'files="$(/usr/local/go/bin/gofmt -l .)"; test -z "$files" || { echo "$files"; exit 1; }'

      - name: Check module files
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            image-play:toolchain \
            go mod tidy -diff

      - name: Vet
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            image-play:toolchain \
            go vet ./...

      - name: Test
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            image-play:toolchain \
            go test ./...

      - name: Build runtime image
        run: docker build --target runtime -t image-play:mosaic .

      - name: Generate all supported effects
        run: |
          mkdir -p ci-output/wordcloud ci-output/textmosaic
          chmod -R 777 ci-output

          for image in testdata/images/*; do
            name="$(basename "$image")"
            stem="${name%.*}"

            for effect in wordcloud textmosaic; do
              echo "::group::$effect — $name"
              docker run --rm \
                -v "$PWD/testdata:/work/testdata:ro" \
                -v "$PWD/fonts:/work/fonts:ro" \
                -v "$PWD/ci-output:/work/output" \
                image-play:mosaic \
                -effect "$effect" \
                -in "/work/$image" \
                -text /work/testdata/text/sample_text_message.txt \
                -font "/work/fonts/NotoSansMono-VariableFont_wdth,wght.ttf" \
                -out "/work/output/$effect/$stem.png"
              test -s "ci-output/$effect/$stem.png"
              file "ci-output/$effect/$stem.png"
              echo "::endgroup::"
            done
          done

      - name: Upload visual test outputs
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-results
          path: ci-output/**/*.png
          if-no-files-found: error
          retention-days: 7
