name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build toolchain image
        run: docker build --target toolchain -t image-play:toolchain .

      - name: Check formatting
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            image-play:toolchain \
            sh -lc 'files="$(gofmt -l .)"; test -z "$files" || { echo "$files"; exit 1; }'

      - name: Check module files
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            image-play:toolchain \
            go mod tidy -diff

      - name: Vet
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            image-play:toolchain \
            go vet ./...

      - name: Test
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            image-play:toolchain \
            go test ./...

      - name: Build runtime image
        run: docker build --target runtime -t image-play:mosaic .

      - name: Smoke test runtime image
        run: |
          mkdir -p ci-output
          chmod 777 ci-output
          docker run --rm \
            -v "$PWD/testdata:/work/testdata:ro" \
            -v "$PWD/fonts:/work/fonts:ro" \
            -v "$PWD/ci-output:/work/output" \
            image-play:mosaic \
            -in /work/testdata/images/deepseek-logo-icon.png \
            -text /work/testdata/text/sample_text_message.txt \
            -font "/work/fonts/NotoSansMono-VariableFont_wdth,wght.ttf" \
            -out /work/output/smoke.png
          test -s ci-output/smoke.png
