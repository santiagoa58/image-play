name: Temp wordcloud verification

on:
  push:
    branches:
      - feature/init-wordcloud
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Build CLI image
        run: docker build --target runtime -t image-play:wordcloud-test .

      - name: Generate DeepSeek word cloud
        run: |
          mkdir -p action-output
          chmod 777 action-output
          docker run --rm \
            -v "$PWD/testdata:/work/testdata:ro" \
            -v "$PWD/fonts:/work/fonts:ro" \
            -v "$PWD/action-output:/work/output" \
            image-play:wordcloud-test \
            -in /work/testdata/images/deepseek-logo-icon.png \
            -text /work/testdata/text/sample_text_message.txt \
            -font "/work/fonts/NotoSansMono-VariableFont_wdth,wght.ttf" \
            -out /work/output/deepseek-wordcloud.png

      - name: Verify output exists
        run: |
          test -s action-output/deepseek-wordcloud.png
          file action-output/deepseek-wordcloud.png
          ls -lh action-output/deepseek-wordcloud.png

      - name: Upload generated word cloud
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-wordcloud
          path: action-output/deepseek-wordcloud.png
          if-no-files-found: error
